<!DOCTYPE html>
<!-- Shows a plain list of applications: used for "applications of a customer" and for the search result -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<header th:replace="~{fragments :: topbar('applications')}"></header>

<main>
    <p class="back"><a th:href="@{/ui/applications}">Back to applications</a></p>

    <div th:replace="~{fragments :: flash}"></div>

    <h1>
        <span th:text="${title}">Applications</span>
        <span class="count" th:text="${#lists.size(applications)}">2</span>
    </h1>

    <!-- th:block is an invisible wrapper: it only carries the th:if -->
    <th:block th:if="${!#lists.isEmpty(applications)}">
        <div th:replace="~{fragments :: applicationTable(${applications})}"></div>
    </th:block>

    <div class="empty-state" th:if="${#lists.isEmpty(applications)}">
        <p>Nothing matches. Go back and try another status, product or amount.</p>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
