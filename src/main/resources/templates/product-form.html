<!DOCTYPE html>
<!--
  One template for two pages:
    productId is missing -> "New product",  the form posts to /ui/products
    productId is present -> "Edit product", the form posts to /ui/products/{id}
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${productId == null} ? 'New product' : 'Edit product')}"></head>
<body>
<header th:replace="~{fragments :: topbar('products')}"></header>

<main class="narrow">
    <p class="back"><a th:href="@{/ui/products}">Back to products</a></p>

    <h1 th:text="${productId == null} ? 'New product' : 'Edit product ' + ${productId}">New product</h1>

    <!-- The service refused the request, e.g. minimum amount is greater than maximum amount -->
    <p class="notice error" role="alert" th:if="${formError}" th:text="${formError}">Minimum amount cannot be greater</p>

    <!-- The field names must match the fields of LoanProductRequest -->
    <form class="card form-page" method="post" novalidate
          th:action="${productId == null} ? @{/ui/products} : @{/ui/products/{id}(id=${productId})}">

        <div th:replace="~{fragments :: field('name', 'Name', 'Must be unique. Letters, digits, spaces and . , &amp; ( ) - only')}"></div>
        <div th:replace="~{fragments :: field('interestRate', 'Interest rate, % per year', 'Between 0 and 100, at most 2 decimal places')}"></div>

        <fieldset>
            <legend>Amount a customer can borrow</legend>
            <div class="pair">
                <div th:replace="~{fragments :: field('minAmount', 'Minimum', 'Greater than 0')}"></div>
                <div th:replace="~{fragments :: field('maxAmount', 'Maximum', 'Not below the minimum')}"></div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Repayment term in months</legend>
            <div class="pair">
                <div th:replace="~{fragments :: field('minTermMonths', 'Minimum', '1 to 360')}"></div>
                <div th:replace="~{fragments :: field('maxTermMonths', 'Maximum', 'Not below the minimum')}"></div>
            </div>
        </fieldset>

        <!-- Strategy pattern: the product chooses how its loans are paid back.
             The option values are the RepaymentType names, so Spring turns the chosen one into the enum.
             A new product starts on ANNUITY; the edit page starts on the product's current method. -->
        <div class="field" th:classappend="${fieldErrors?.get('repaymentType') != null} ? 'invalid'">
            <label for="repaymentType">Repayment method</label>
            <select id="repaymentType" name="repaymentType" aria-describedby="repaymentType-help">
                <option th:each="t : ${repaymentTypes}" th:value="${t.name()}" th:text="${t.label}"
                        th:selected="${(values?.get('repaymentType') ?: 'ANNUITY') == t.name()}">Equal monthly payments</option>
            </select>
            <p class="help" id="repaymentType-help"
               th:text="${fieldErrors?.get('repaymentType')} ?: 'Decreasing payments cost less interest in total, but the first payments are higher'">Hint</p>
        </div>

        <!-- One checkbox per document type. Every ticked box is sent as requiredDocumentTypeIds=<id>,
             and Spring collects them into the Set<Long> of LoanProductRequest. -->
        <fieldset class="checks" th:classappend="${fieldErrors?.get('requiredDocumentTypeIds') != null} ? 'invalid'">
            <legend>Documents a customer must upload</legend>
            <!-- The hidden field starting with "_" tells Spring: "this field was on the form".
                 Without it, no ticked box would mean "field missing" and not "an empty list". -->
            <input type="hidden" name="_requiredDocumentTypeIds" value="on">

            <label class="check" th:each="d : ${documentTypes}">
                <input type="checkbox" name="requiredDocumentTypeIds" th:value="${d.id}"
                       th:checked="${checkedIds.contains(d.id.toString())}">
                <span th:text="${d.name}">ID Card</span>
            </label>

            <p class="help" th:if="${#lists.isEmpty(documentTypes)}">No document types exist yet.</p>
            <p class="help" th:text="${fieldErrors?.get('requiredDocumentTypeIds')} ?: 'Tick none if this product needs no documents'">Hint</p>
        </fieldset>

        <div class="form-actions">
            <button type="submit" th:text="${productId == null} ? 'Create product' : 'Save changes'">Create product</button>
            <a th:href="@{/ui/products}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
