<!DOCTYPE html>
<!-- Shown by WebController.handleServiceError when a service throws one of our custom exceptions -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Request refused')}"></head>
<body>
<header th:replace="~{fragments :: topbar('')}"></header>

<main class="narrow">
    <h1>That could not be done</h1>

    <div class="notice error" role="alert">
        <p th:text="${errorMessage}">Application with id 1 is APPROVED and cannot be approved</p>
    </div>

    <p class="lead">Nothing was changed. The rule that stopped it:
        <code th:text="${errorType}">ConflictException</code>
    </p>

    <p class="form-actions">
        <a class="button" href="javascript:history.back()">Go back</a>
        <a th:href="@{/ui}">Go to the home page</a>
    </p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
