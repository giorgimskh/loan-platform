<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<header th:replace="~{fragments :: sidebar('products')}"></header>

<main>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="title-row">
        <h1>Loan products <span class="count" th:text="${#lists.size(products)}">2</span></h1>
        <a class="button" th:href="@{/ui/products/new}">New product</a>
    </div>

    <table class="ledger" th:if="${!#lists.isEmpty(products)}">
        <thead>
        <tr>
            <th>Product</th>
            <th class="number">Interest</th>
            <th class="number">Amount</th>
            <th class="number">Term</th>
            <th>Required documents</th>
            <th><span class="visually-hidden">Actions</span></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td>
                <strong th:text="${p.name}">Consumer Loan</strong>
                <span class="sub" th:text="'Product ' + ${p.id}">Product 1</span>
            </td>
            <td class="number" th:text="${p.interestRate} + '%'">14.50%</td>
            <td class="number"
                th:text="${#numbers.formatDecimal(p.minAmount, 1, 'COMMA', 0, 'POINT')} + ' to ' + ${#numbers.formatDecimal(p.maxAmount, 1, 'COMMA', 0, 'POINT')}">
                500 to 20,000
            </td>
            <td class="number" th:text="${p.minTermMonths} + ' to ' + ${p.maxTermMonths} + ' mo'">3 to 48 mo</td>
            <td>
                <span class="tag" th:each="d : ${p.requiredDocuments}" th:text="${d.name}">ID Card</span>
                <span class="sub" th:if="${#lists.isEmpty(p.requiredDocuments)}">None</span>
            </td>
            <td class="row-actions">
                <a th:href="@{/ui/products/{id}/edit(id=${p.id})}" th:attr="aria-label='Edit ' + ${p.name}">Edit</a>
                <!-- an HTML form cannot send DELETE, so the website uses POST .../delete.
                     confirm() asks before deleting; "Cancel" stops the form from being sent. -->
                <form th:action="@{/ui/products/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Delete this product? This cannot be undone.')">
                    <button type="submit" class="link danger" th:attr="aria-label='Delete ' + ${p.name}">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(products)}">
        <p>No loan products yet. Customers can only apply once a product exists.</p>
        <a class="button" th:href="@{/ui/products/new}">New product</a>
    </div>
</main>
</body>
</html>
