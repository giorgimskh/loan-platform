<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Applications')}"></head>
<body>
<header th:replace="~{fragments :: sidebar('applications')}"></header>

<main>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="title-row">
        <h1>Applications <span class="count" th:text="${page.totalElements}">12</span></h1>
        <a class="button" th:href="@{/ui/applications/new}">New application</a>
    </div>

    <!-- Status filter as links: each one is the same page with ?status=... in the URL -->
    <nav class="tabs" aria-label="Filter by status">
        <a th:href="@{/ui/applications}" th:classappend="${status == null} ? 'current'">All</a>
        <a th:each="s : ${statuses}"
           th:href="@{/ui/applications(status=${s})}"
           th:classappend="${s == status} ? 'current'"
           th:text="${#strings.capitalize(#strings.toLowerCase(s))}">Submitted</a>
    </nav>

    <!-- "page" is a Spring Data Page: page.content is the list of rows on this page -->
    <!-- th:block is an invisible wrapper: it only carries the th:if -->
    <th:block th:if="${!page.isEmpty()}">
        <table th:replace="~{fragments :: applicationTable(${page.content})}"></table>
    </th:block>

    <div class="empty-state" th:if="${page.isEmpty()}">
        <p th:if="${status == null}">No applications yet. Start one for a registered customer.</p>
        <p th:if="${status != null}"
           th:text="'No ' + ${#strings.toLowerCase(status)} + ' applications. Choose another status to see the rest.'">
            No approved applications.
        </p>
    </div>

    <!-- Pager: only shown when there is more than one page -->
    <nav class="pager" aria-label="Pages" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" th:href="@{/ui/applications(status=${status}, page=${page.number - 1})}">Previous</a>
        <span th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page 1 of 3</span>
        <a th:if="${page.hasNext()}" th:href="@{/ui/applications(status=${status}, page=${page.number + 1})}">Next</a>
    </nav>

    <section class="panel search" aria-labelledby="search-title">
        <h2 id="search-title">Find large applications for one product</h2>
        <form th:action="@{/ui/applications/search}" method="get">
            <div class="field">
                <label for="productName">Product</label>
                <select id="productName" name="productName" required>
                    <option th:each="p : ${products}" th:value="${p.name}" th:text="${p.name}">Consumer Loan</option>
                </select>
            </div>
            <div class="field">
                <label for="amountAbove">Amount above</label>
                <input id="amountAbove" type="number" name="amountAbove" value="1000" min="0" step="0.01" required>
            </div>
            <button type="submit" class="quiet">Search</button>
        </form>
    </section>
</main>
</body>
</html>
