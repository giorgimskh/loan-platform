spring.application.name=loan-platform

# --- Database (PostgreSQL from docker-compose.yml, host port 5433) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/loan_platform
spring.datasource.username=loan
spring.datasource.password=loan

# --- JPA / Hibernate ---
# update = create/alter tables from the entities on startup (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# do not keep the DB session open while the JSON is written; services load everything they need
spring.jpa.open-in-view=false

# --- Pagination JSON: stable {"content": [...], "page": {...}} format ---
spring.data.web.pageable.serialization-mode=via_dto

# --- File upload ---
app.upload-dir=uploads
# Global size limits, checked by Spring for EVERY request before any controller code runs.
# A bigger upload is stopped while it is read (MaxUploadSizeExceededException), so it never fills
# memory or the disk; GlobalExceptionHandler turns it into a clean 400 response.
# max-file-size: one file; max-request-size: the whole request (file + documentTypeId + headroom).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# After refusing an upload, Tomcat reads ("swallows") the rest of the request so the client still
# receives the 400 answer. It reads at most 10MB more; for an even bigger request it closes the
# connection instead, so nobody can keep the server busy reading a huge body.
server.tomcat.max-swallow-size=10MB

# --- Swagger UI (http://localhost:8080/swagger-ui.html) ---
# only the REST API is documented, not the /ui website
springdoc.paths-to-match=/api/**
