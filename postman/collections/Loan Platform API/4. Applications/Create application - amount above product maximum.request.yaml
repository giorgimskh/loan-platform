$kind: http-request
description: Rule 1.
url: "{{baseUrl}}/api/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": {{customerId}},
      "loanProductId": {{productId}},
      "amount": 999999,
      "termMonths": 12
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("Amount must be between");
      });
    language: text/javascript
order: 5000
