$kind: http-request
description: "Rule 3: new applications start as SUBMITTED."
url: "{{baseUrl}}/api/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": {{customerId}},
      "loanProductId": {{productId}},
      "amount": 5000,
      "termMonths": 12
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("applicationId", pm.response.json().id);
      pm.test("New application starts as SUBMITTED", function () {
          pm.expect(pm.response.json().status).to.eql("SUBMITTED");
      });
    language: text/javascript
order: 1000
