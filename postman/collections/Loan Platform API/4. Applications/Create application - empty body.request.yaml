$kind: http-request
url: "{{baseUrl}}/api/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("fieldErrors lists the invalid fields", function () {
          const errors = pm.response.json().fieldErrors;
          pm.expect(errors).to.have.property("customerId");
          pm.expect(errors).to.have.property("loanProductId");
          pm.expect(errors).to.have.property("amount");
          pm.expect(errors).to.have.property("termMonths");
      });
    language: text/javascript
order: 9000
