$kind: http-request
url: "{{baseUrl}}/api/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": {{customerId}},
      "loanProductId": 999999,
      "amount": 5000,
      "termMonths": 12
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("Loan product");
      });
    language: text/javascript
order: 8000
