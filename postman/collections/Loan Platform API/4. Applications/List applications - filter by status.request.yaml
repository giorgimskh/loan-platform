$kind: http-request
url: "{{baseUrl}}/api/applications?status=SUBMITTED&size=50"
method: GET
queryParams:
  status: SUBMITTED
  size: "50"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Only SUBMITTED applications are returned", function () {
          pm.response.json().content.forEach(a => pm.expect(a.status).to.eql("SUBMITTED"));
      });
    language: text/javascript
order: 15000
