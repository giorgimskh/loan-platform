$kind: http-request
description: Amount 1000-50000, term 6-60 months, requires document type 1 (ID Card).
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{productName}}",
      "interestRate": 11.5,
      "minAmount": 1000,
      "maxAmount": 50000,
      "minTermMonths": 6,
      "maxTermMonths": 60,
      "requiredDocumentTypeIds": [1]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("productId", pm.response.json().id);
    language: text/javascript
order: 2000
