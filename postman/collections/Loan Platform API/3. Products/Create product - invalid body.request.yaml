$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "interestRate": 150
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("fieldErrors lists the invalid fields", function () {
          const errors = pm.response.json().fieldErrors;
          pm.expect(errors).to.have.property("name");
          pm.expect(errors).to.have.property("interestRate");
          pm.expect(errors).to.have.property("minAmount");
          pm.expect(errors).to.have.property("maxAmount");
      });
    language: text/javascript
order: 7000
