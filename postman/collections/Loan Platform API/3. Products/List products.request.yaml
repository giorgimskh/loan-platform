$kind: http-request
url: "{{baseUrl}}/api/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is a list", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });
    language: text/javascript
order: 1000
