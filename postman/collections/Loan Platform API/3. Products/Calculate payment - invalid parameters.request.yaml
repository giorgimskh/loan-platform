$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}/calculate?amount=0&termMonths=500"
method: GET
queryParams:
  amount: "0"
  termMonths: "500"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Field errors are returned", function () {
          const errors = pm.response.json().fieldErrors;
          pm.expect(errors).to.have.property("amount");
          pm.expect(errors).to.have.property("termMonths");
      });
    language: text/javascript
order: 12000
