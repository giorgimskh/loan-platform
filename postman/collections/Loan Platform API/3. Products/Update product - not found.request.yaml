$kind: http-request
url: "{{baseUrl}}/api/products/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{productName}} D",
      "interestRate": 11.5,
      "minAmount": 1000,
      "maxAmount": 50000,
      "minTermMonths": 6,
      "maxTermMonths": 60,
      "requiredDocumentTypeIds": [1]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 14000
