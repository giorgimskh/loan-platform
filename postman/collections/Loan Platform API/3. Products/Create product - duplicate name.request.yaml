$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{productName}}",
      "interestRate": 11.5,
      "minAmount": 1000,
      "maxAmount": 50000,
      "minTermMonths": 6,
      "maxTermMonths": 60,
      "requiredDocumentTypeIds": [1]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("already exists");
      });
    language: text/javascript
order: 3000
