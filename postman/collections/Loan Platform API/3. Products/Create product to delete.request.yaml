$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{productName}} temp",
      "interestRate": 11.5,
      "minAmount": 1000,
      "maxAmount": 50000,
      "minTermMonths": 6,
      "maxTermMonths": 60,
      "requiredDocumentTypeIds": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("tempProductId", pm.response.json().id);
    language: text/javascript
order: 15000
