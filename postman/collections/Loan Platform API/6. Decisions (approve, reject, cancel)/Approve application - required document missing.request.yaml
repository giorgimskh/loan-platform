$kind: http-request
description: "Rule 7: nothing was uploaded for this application yet."
url: "{{baseUrl}}/api/applications/{{approveApplicationId}}/approve"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("The message names the missing document", function () {
          pm.expect(pm.response.json().message).to.include("ID Card");
      });
    language: text/javascript
order: 1000
