$kind: http-request
url: "{{baseUrl}}/api/applications/{{approveApplicationId}}/missing-documents"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("ID Card is listed", function () {
          const body = pm.response.json();
          pm.expect(body).to.have.lengthOf(1);
          pm.expect(body[0].name).to.eql("ID Card");
      });
    language: text/javascript
order: 2000
