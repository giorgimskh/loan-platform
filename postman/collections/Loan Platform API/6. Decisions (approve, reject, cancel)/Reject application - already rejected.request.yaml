$kind: http-request
description: "Rule 4: a decision can be changed, but not repeated."
url: "{{baseUrl}}/api/applications/{{rejectApplicationId}}/reject"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decisionComment": "Again"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
order: 10000
