$kind: http-request
url: "{{baseUrl}}/api/applications/{{approveApplicationId}}/schedule"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("One payment per month, and nothing is left at the end", function () {
          const body = pm.response.json();
          pm.expect(body.payments).to.have.lengthOf(24);
          pm.expect(body.payments[23].remainingBalance).to.eql(0);
          pm.expect(body.summary.monthlyPayment).to.be.above(0);
      });
    language: text/javascript
order: 6000
