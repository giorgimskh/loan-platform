$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}/applications?status=WRONG"
method: GET
queryParams:
  status: WRONG
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 4000
