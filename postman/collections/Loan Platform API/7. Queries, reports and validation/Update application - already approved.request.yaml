$kind: http-request
url: "{{baseUrl}}/api/applications/{{approveApplicationId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "loanProductId": {{productId}},
      "amount": 5000,
      "termMonths": 18
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("cannot be modified");
      });
    language: text/javascript
order: 1000
