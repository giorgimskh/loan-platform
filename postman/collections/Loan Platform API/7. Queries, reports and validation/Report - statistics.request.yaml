$kind: http-request
url: "{{baseUrl}}/api/applications/reports/statistics"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("The counts add up and the rate is a percentage", function () {
          const body = pm.response.json();
          pm.expect(body.approved).to.be.at.least(1);
          pm.expect(body.totalApplications).to.eql(body.submitted + body.approved + body.rejected);
          pm.expect(body.approvalRate).to.be.within(0, 100);
      });
    language: text/javascript
order: 10000
