$kind: http-request
url: "{{baseUrl}}/api/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": -1,
      "loanProductId": 0,
      "amount": 5000.999,
      "termMonths": 12
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Field errors for customerId, loanProductId and amount", function () {
          const errors = pm.response.json().fieldErrors;
          pm.expect(errors).to.have.property("customerId");
          pm.expect(errors).to.have.property("loanProductId");
          pm.expect(errors).to.have.property("amount");
      });
    language: text/javascript
order: 14000
