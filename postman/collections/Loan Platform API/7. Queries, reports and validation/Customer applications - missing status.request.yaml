$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}/applications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error names the missing parameter", function () {
          pm.expect(pm.response.json().message).to.include("status");
      });
    language: text/javascript
order: 3000
