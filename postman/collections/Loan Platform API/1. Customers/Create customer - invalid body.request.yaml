$kind: http-request
url: "{{baseUrl}}/api/customers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "",
      "email": "not-an-email",
      "personalNumber": "12"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("fieldErrors lists the invalid fields", function () {
          const errors = pm.response.json().fieldErrors;
          pm.expect(errors).to.have.property("fullName");
          pm.expect(errors).to.have.property("email");
          pm.expect(errors).to.have.property("personalNumber");
      });
    language: text/javascript
order: 3000
