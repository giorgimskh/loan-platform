$kind: http-request
url: "{{baseUrl}}/api/customers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ana Beridze",
      "email": "{{email}}",
      "personalNumber": "{{personalNumber}}",
      "phone": "555123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("already exists");
      });
    language: text/javascript
order: 2000
