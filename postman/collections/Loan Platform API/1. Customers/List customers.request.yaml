$kind: http-request
description: "Paginated like the applications list: ?page=0&size=10&sort=fullName,asc"
url: "{{baseUrl}}/api/customers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is one page of customers", function () {
          const body = pm.response.json();
          pm.expect(body.content).to.be.an("array");
          pm.expect(body.page.totalElements).to.be.at.least(1);
      });
    language: text/javascript
order: 6000
