$kind: http-request
description: Keeping the customer's own email and personal number is allowed.
url: "{{baseUrl}}/api/customers/{{customerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ana Beridze",
      "email": "{{email}}",
      "personalNumber": "{{personalNumber}}",
      "phone": "+995555000111"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("New phone is returned, email is unchanged", function () {
          const body = pm.response.json();
          pm.expect(body.phone).to.eql("+995555000111");
          pm.expect(body.email).to.eql(pm.collectionVariables.get("email"));
      });
    language: text/javascript
order: 9000
