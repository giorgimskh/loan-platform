$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ana Beridze",
      "email": "not-an-email",
      "personalNumber": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Field errors are returned", function () {
          const errors = pm.response.json().fieldErrors;
          pm.expect(errors).to.have.property("email");
          pm.expect(errors).to.have.property("personalNumber");
      });
    language: text/javascript
order: 10000
