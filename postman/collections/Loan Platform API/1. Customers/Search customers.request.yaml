$kind: http-request
description: search looks in the name, the email and the personal number, ignoring upper and lower case.
url: "{{baseUrl}}/api/customers?search={{email}}"
method: GET
queryParams:
  search: "{{email}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Only the customer with this email is found", function () {
          const body = pm.response.json();
          pm.expect(body.content).to.have.lengthOf(1);
          pm.expect(body.content[0].email).to.eql(pm.collectionVariables.get("email"));
      });
    language: text/javascript
order: 7000
