$kind: http-request
url: "{{baseUrl}}/api/document-types"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{documentTypeName}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // a unique name, so the collection can be run again and again
      pm.collectionVariables.set("documentTypeName", "Passport " + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("documentTypeId", pm.response.json().id);
    language: text/javascript
order: 2000
