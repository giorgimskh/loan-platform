$kind: http-request
url: "{{baseUrl}}/api/document-types"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("The sample type ID Card is in the list", function () {
          const names = pm.response.json().map(function (d) { return d.name; });
          pm.expect(names).to.include("ID Card");
      });
    language: text/javascript
order: 1000
