$kind: http-request
url: "{{baseUrl}}/api/document-types"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "<script>"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Field error is returned for name", function () {
          pm.expect(pm.response.json().fieldErrors).to.have.property("name");
      });
    language: text/javascript
order: 4000
