$kind: http-request
description: In the Postman app, click the 'file' value and select the file from the postman/files folder of the project.
url: "{{baseUrl}}/api/applications/999999/documents"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - postman/files/sample.pdf
    - type: text
      key: documentTypeId
      value: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 6000
