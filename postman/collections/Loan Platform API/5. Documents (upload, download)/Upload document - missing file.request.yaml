$kind: http-request
url: "{{baseUrl}}/api/applications/{{applicationId}}/documents"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: documentTypeId
      value: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("file");
      });
    language: text/javascript
order: 5000
