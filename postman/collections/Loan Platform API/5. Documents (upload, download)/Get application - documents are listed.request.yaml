$kind: http-request
url: "{{baseUrl}}/api/applications/{{applicationId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Application has 2 documents", function () {
          pm.expect(pm.response.json().documents).to.have.lengthOf(2);
      });
    language: text/javascript
order: 8000
