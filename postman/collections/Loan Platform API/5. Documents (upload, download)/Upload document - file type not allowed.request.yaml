$kind: http-request
description: Rule 6. In the Postman app, click the 'file' value and select the file from the postman/files folder of the project.
url: "{{baseUrl}}/api/applications/{{applicationId}}/documents"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - postman/files/sample.txt
    - type: text
      key: documentTypeId
      value: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message is returned", function () {
          pm.expect(pm.response.json().message).to.include("Only PDF, JPG and PNG");
      });
    language: text/javascript
order: 3000
